# Weekly pull requests into dev for outdated versions. CI runs on each one.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /server
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      server:
        patterns: ["*"]
    ignore:
      # Tests use the same Postgres major version as production (postgres:17).
      - dependency-name: io.zonky.test.postgres:embedded-postgres-binaries-bom
        update-types: [version-update:semver-major]

  - package-ecosystem: gradle
    directory: /android
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      android:
        patterns: ["*"]
    ignore:
      # Pinned to room-testing's version (see the constraint in app/build.gradle.kts).
      - dependency-name: org.jetbrains.kotlinx:kotlinx-serialization-core

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
