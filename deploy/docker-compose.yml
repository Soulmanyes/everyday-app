# Runs on the Oracle Cloud VM. Only Caddy publishes ports; the API and Postgres
# are reachable only on the internal network.
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ../server
    restart: unless-stopped
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      PORT: "8080"
      # One-time code for creating the household. Remove it from .env once the household exists.
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      # Instant updates (FCM): the Firebase service-account key, mounted below.
      FCM_CREDENTIALS: /run/secrets/firebase-service-account.json
    volumes:
      # Kept outside the code folder (rsync never touches it) in ~/secrets on the VM. The file must be
      # readable by the container's user (mode 644; the 700 folder keeps other users out). If it's
      # missing the API doesn't start, instead of Docker creating an empty folder in its place.
      - type: bind
        source: ${FCM_KEY_FILE:-/home/opc/secrets/firebase-service-account.json}
        target: /run/secrets/firebase-service-account.json
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./download:/srv/download:ro
      - ./apps:/srv/apps:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
  caddy_config:
